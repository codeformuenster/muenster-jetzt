apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend-static
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend-static
    spec:
      serviceAccountName: backend-static
      enableServiceLinks: false
      containers:
      - image: docker.io/codeformuenster/muenster-jetzt-api-static:master
        name: backend-static
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8001
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      volumes:
      - name: tmpdir
        emptyDir:
          medium: Memory
      - name: nginx-cache
        emptyDir:
          medium: Memory
