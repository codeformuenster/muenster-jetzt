apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawler
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      parallelism: 1
      activeDeadlineSeconds: 3300
      template:
        spec:
          serviceAccountName: backend-crawler
          enableServiceLinks: false
          restartPolicy: OnFailure

          containers:
          - image: docker.io/codeformuenster/muenster-jetzt-api:master
            name: crawler
            args:
            - ./manage.py
            - crawl
            resources:
              requests:
                memory: "128Mi"
                cpu: "150m"
              limits:
                memory: "2048Mi"
                cpu: "2000m"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            envFrom:
            - secretRef:
                name: backend-api
                optional: false
            env:
            - name: DJANGO_DEBUG
              value: "False"
            - name: HOME
              value: /tmp
            volumeMounts:
            - name: tmpdir
              mountPath: /tmp
          volumes:
          - name: tmpdir
            emptyDir:
              medium: Memory
