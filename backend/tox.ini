[tox]
envlist = py313

[testenv]
setenv =
    DJANGO_SECRET_KEY = tox-test-only
    DB_HOST = 127.0.0.1
    DB_PORT = 5432
    DB_NAME = mj
    DB_USER = mj
    DB_PASSWORD = mj
commands =
    flake8
    black --check .
    python manage.py check
    python manage.py makemigrations --check --dry-run
    python manage.py test events
deps =
    -rrequirements.txt
    flake8
    black

[flake8]
exclude =
    .git,
    .venv,
    .tox,
    migrations
